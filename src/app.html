<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<!-- Match --bg in each scheme (layout.css). Kept in step with an explicit theme by the script below and the theme toggle. -->
		<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'light' || t === 'dark') {
						document.documentElement.setAttribute('data-theme', t);
						var c = t === 'light' ? '#f3efe6' : '#0e0e0d';
						var m = document.querySelectorAll('meta[name="theme-color"]');
						for (var i = 0; i < m.length; i++) m[i].setAttribute('content', c);
					}
				} catch (e) {}
			})();
		</script>

		<!-- Google tag (gtag.js), loaded after the window load event so it never competes with first render -->
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag('js', new Date());
			gtag('config', 'G-DVRTYNE84X');
			window.addEventListener('load', function () {
				var s = document.createElement('script');
				s.async = true;
				s.src = 'https://www.googletagmanager.com/gtag/js?id=G-DVRTYNE84X';
				document.head.appendChild(s);
			});
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
